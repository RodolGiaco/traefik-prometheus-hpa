# video-playback expone metricas tanto HTTP (pbbase/pbvideotest, ver
# 0-configmap/0-prometheus-adapter-config.yaml) como TCP (pbtcpbase/
# pbtcpvideotest). Este archivo escala por la parte TCP.
#
# Un Deployment solo puede ser el scaleTargetRef de un unico HPA -- si en
# algun momento se necesita escalar tambien por la parte HTTP, esa metrica
# tiene que sumarse como una entrada mas dentro de "metrics:" de ESTE mismo
# HPA, no como un HPA nuevo apuntando al mismo Deployment (Kubernetes lo
# rechaza con "AmbiguousSelector").
#
# El selector usa "entrypoint" (no "host", como en 1-doug.yaml) porque la
# metrica TCP viene de traefik_open_connections, que no tiene label de host.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-video-playback-tcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video-playback
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric:
          name: pbtcpbase
          selector:
            matchLabels:
              entrypoint: pbtcp
        target:
          type: AverageValue
          averageValue: 4000m # 4 conexiones maximas TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-video-playback-videotest-tcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video-playback-videotest
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric:
          name: pbtcpvideotest
          selector:
            matchLabels:
              entrypoint: pbtcpvideotest
        target:
          type: AverageValue
          averageValue: 4000m # 4 conexiones maximas TCP